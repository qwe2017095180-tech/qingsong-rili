name: Publish 轻松日程 1.3.1
on:
  push:
    branches: [release/qingsong-rili-1.3.1]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: v1.3.1
      RELEASE_COMMIT: 29ebf1e0eb7dfa4bdea68f3013ae207d22e2fae4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 29ebf1e0eb7dfa4bdea68f3013ae207d22e2fae4
          persist-credentials: false
      - name: Verify and package
        run: |
          node --test test/update.test.mjs
          node --check public/app.js
          node -e 'if ("v" + require("./version.json").version !== process.env.RELEASE_TAG) process.exit(1)'
          git archive --format=zip --prefix=qingsong-rili-1.3.1/ -o qingsong-rili-1.3.1.zip HEAD
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" qingsong-rili-1.3.1.zip \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_COMMIT" \
            --title "轻松日程 $RELEASE_TAG" \
            --notes "按轻松打卡原版样式调整轻松日程：暖灰背景、蓝色标题、浅紫卡片、底部导航和可展开的日历。保留直接添加日程与应用内更新。"
