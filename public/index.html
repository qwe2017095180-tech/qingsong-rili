<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>轻松日程</title>
<link rel="icon" href="/schedule-icon.png" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header class="topbar">
  <div class="app-heading">
    <button class="header-pill" id="todayBtn" type="button" aria-label="回到今天" title="回到今天">◷</button>
    <h1>轻松日程</h1>
    <button class="header-pill" id="addBtn" type="button" aria-label="添加日程" title="添加日程">＋</button>
  </div>
  <div class="top-actions">
    <div class="next-run" id="nextRun">—</div>
    <button class="btn primary" id="runBtn">立即整理</button>
    <a class="btn ghost" id="bridgeBtn" href="/bridge.html" title="连接轻松打卡">连接</a>
    <button class="btn ghost" id="annBtn" title="使用公告">公告<span class="dot" id="annDot" hidden></span></button>
  </div>
</header>

<div class="runbar" id="runBar" hidden>
  <div class="runbar-inner">
    <span class="pulse"></span>
    <span id="runText">正在整理…</span>
    <div class="runbar-track"><div class="runbar-fill" id="runFill"></div></div>
  </div>
</div>

<div class="toastbar" id="toast" hidden></div>

<nav class="tabs" id="tabs" aria-label="日程分类"></nav>

<section class="day-bar" id="dayBar" aria-label="选择日期" hidden>
  <div class="calendar-toolbar">
    <button class="header-pill calendar-arrow" type="button" id="prevDay" aria-label="上一周">‹</button>
    <h2 id="dayTitle"></h2>
    <button class="header-pill calendar-arrow" type="button" id="nextDay" aria-label="下一周">›</button>
  </div>
  <div class="weekdays" aria-hidden="true">
    <span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span>
  </div>
  <div class="calendar-days" id="calendarDays"></div>
  <div class="agenda-heading">
    <h2 id="agendaTitleHeading">今日日程</h2>
    <p id="dayProgress" aria-live="polite"></p>
    <button class="btn ghost calendar-toggle" id="calendarToggle" type="button" aria-expanded="false">展开日历</button>
  </div>
</section>

<div class="archive-bar" id="archiveBar" hidden>
  <span id="archiveBarText">—</span>
  <button class="btn ghost" id="clearArchiveBtn">🗑 一键删除全部归档</button>
</div>

<main id="grid" class="grid"></main>

<section class="empty" id="empty" hidden>
  <div class="empty-art">🌱</div>
  <h2 id="emptyTitle">还没有整理过</h2>
  <p id="emptyText">先去设置里挑几个群，然后点「立即整理」，<br/>我会把里面的作业、兼职、比赛、活动都捞出来。</p>
  <button class="btn primary" id="emptyAction">去选择群</button>
</section>

<nav class="app-navigation" id="modeSwitch" aria-label="主导航">
  <div class="app-navigation-inner">
    <button type="button" data-mode="notice" data-view="today" class="on" aria-current="page"><span class="nav-date" id="navDate" aria-hidden="true"></span>今日</button>
    <button type="button" data-mode="notice" data-view="all"><span aria-hidden="true">☷</span>日程</button>
    <button type="button" data-mode="fun"><span aria-hidden="true">☆</span>娱乐</button>
    <button type="button" id="settingsBtn"><span aria-hidden="true">···</span>更多</button>
  </div>
</nav>

<div class="mask" id="mask" hidden></div>

<aside class="drawer" id="drawer" hidden></aside>

<aside class="drawer settings" id="settingsDrawer" hidden>
  <div class="drawer-head">
    <h2>更多</h2>
    <button class="close" id="closeSettings">×</button>
  </div>
  <div class="drawer-body" id="settingsBody"></div>
  <div class="s-foot-fixed">
    <button class="btn primary" id="saveSettings" style="flex:1">保存设置</button>
    <button class="btn ghost" id="cancelSettings">取消</button>
  </div>
</aside>

<aside class="drawer settings" id="addDrawer" hidden>
  <div class="drawer-head">
    <h2>添加日程</h2>
    <button class="close" id="closeAdd" aria-label="关闭添加日程">×</button>
  </div>
  <div class="drawer-body">
    <div class="seg" id="addMode" aria-label="添加方式">
      <button class="on" type="button" data-add-mode="direct">直接添加</button>
      <button type="button" data-add-mode="paste">粘贴整理</button>
    </div>
    <form id="directAgenda" class="agenda-form">
      <label>标题<input class="s-input" id="agendaTitle" required maxlength="60" /></label>
      <div class="agenda-form-row">
        <label>日期<input class="s-input" id="agendaDate" type="date" required /></label>
        <label>时间（可选）<input class="s-input" id="agendaTime" type="time" /></label>
      </div>
      <label>备注<textarea class="s-input" id="agendaNote" rows="3" maxlength="500"></textarea></label>
    </form>
    <div id="pasteAgenda" hidden>
      <div class="s-block">
        <label class="s-title" for="addText">通知内容</label>
        <textarea id="addText" class="s-input" placeholder="例如：下周三前交设计作业，带两张 A3 纸。" rows="6" maxlength="20000"></textarea>
      </div>
      <div class="s-block">
        <label class="s-title" for="addSource">来源（可选）</label>
        <input class="s-input" id="addSource" placeholder="例如：班群" maxlength="80" />
      </div>
    </div>
  </div>
  <div class="s-foot-fixed">
    <button class="btn primary" id="submitAdd" style="flex:1">保存日程</button>
    <button class="btn ghost" id="cancelAdd">取消</button>
  </div>
</aside>

<aside class="drawer settings" id="annDrawer" hidden>
  <div class="drawer-head">
    <h2>使用公告</h2>
    <button class="close" id="closeAnn">×</button>
  </div>
  <div class="drawer-body" id="annBody"></div>
  <div class="s-foot-fixed">
    <button class="btn primary" id="annOk" style="flex:1">知道了</button>
  </div>
</aside>

<dialog id="updateDialog" class="update-dialog" aria-labelledby="updateTitle">
  <h2 id="updateTitle">应用更新</h2>
  <p id="updateStatus" role="status" aria-live="polite"></p>
  <p id="updateNotes"></p>
  <div class="update-actions">
    <button class="btn ghost" id="dismissUpdate" type="button">稍后</button>
    <button class="btn primary" id="installUpdate" type="button" hidden>立即更新</button>
    <a class="btn primary" id="downloadUpdate" target="_blank" rel="noopener noreferrer" hidden>前往下载</a>
  </div>
</dialog>
<script src="/app.js"></script>
<script src="/add.js"></script>
<script src="/update.js"></script>
</body>
</html>
